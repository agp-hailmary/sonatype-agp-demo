# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=sonatype-lifecycle-demo

# ── H2 In-Memory Database ────────────────────────────────────────────────────
# Using H2 2.1.212 (CVE-2022-23221, CVSS 9.8 — Golden PR #2).
# The H2 web console is DISABLED, which means the JNDI/INIT RUNSCRIPT attack
# vector is NOT REACHABLE — this is the Automated Waiver scenario.
spring.datasource.url=jdbc:h2:mem:demostore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console explicitly disabled — keeps CVE-2022-23221 NOT REACHABLE
spring.h2.console.enabled=false

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Logging ───────────────────────────────────────────────────────────────────
# Log4j2 configuration is loaded from log4j2-spring.xml (classpath).
# Root level INFO keeps the demo output readable while ensuring the
# Log4Shell-reachable logger.info() calls in SearchService are exercised.
logging.config=classpath:log4j2-spring.xml
