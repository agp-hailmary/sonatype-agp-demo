name: Sonatype Lifecycle Policy Evaluation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-evaluate:
    name: Build & Sonatype Lifecycle Scan
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 (matches the pom.xml target) ───────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # ── 3. Build ──────────────────────────────────────────────────────────
      # -DskipTests keeps the CI scan fast; the JAR is what Lifecycle scans.
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # ── 4. Sonatype Lifecycle Policy Evaluation ───────────────────────────
      # Secrets required (Settings → Secrets → Actions):
      #   IQ_SERVER_URL  — e.g. https://your-iq-server.example.com
      #   IQ_USERNAME    — service account username
      #   IQ_PASSWORD    — service account password
      #
      # Demo scenarios triggered by this scan:
      #   • CVE-2021-44228 (Log4Shell, CVSS 10.0)  — REACHABLE  → FAIL
      #   • CVE-2022-42889 (Text4Shell, CVSS 9.8)  — REACHABLE  → FAIL
      #   • CVE-2022-23221 (H2 console, CVSS 9.8)  — NOT REACHABLE → Automated Waiver
      #   • CVE-2015-6420  (commons-collections)   — NOT REACHABLE → Automated Waiver
      #   • CVE-2022-25857 (snakeyaml, CVSS 7.5)   — transitive dep → Golden PR
      #
      # Reachability Analysis:
      #   enable-reachability — traces call graphs in JVM bytecode to determine
      #     whether the vulnerable method is actually reachable from the application.
      #   reachability-namespaces — limits the call-graph traversal to this app's
      #     package so analysis is fast and focused on real call paths.
      #   scan-targets — the Spring Boot fat JAR (contains all embedded deps AND
      #     the application bytecode that Lifecycle uses for call-graph analysis).
      - name: Sonatype Lifecycle Evaluation
        uses: sonatype/actions/evaluate@v1
        with:
          iq-server-url: ${{ secrets.IQ_SERVER_URL }}
          username: ${{ secrets.IQ_USERNAME }}
          password: ${{ secrets.IQ_PASSWORD }}
          application-id: sonatype-lifecycle-demo
          stage: build
          scan-targets: target/lifecycle-demo-store-1.0.0-SNAPSHOT.jar
          enable-reachability: true
          reachability-namespaces: com.sonatype.demo
        env:
          NEXUS_IQ_BRANCH: ${{ github.ref_name }}

      # ── 5. Upload JAR artifact ────────────────────────────────────────────
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonatype-lifecycle-demo-jar
          path: target/*.jar
          retention-days: 7
